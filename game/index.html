<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — a stealth heist</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 150vh); aspect-ratio: 3 / 2; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Midnight Vault: sneak past guards and cameras, lift the vault gem and reach the van"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
